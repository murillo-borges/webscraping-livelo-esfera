name: Enviar promoções diariamente no grupo

on:
  # O agendamento nao usa mais o "schedule:" do GitHub Actions - a fila
  # interna dele atrasa (as vezes horas) em periodos de pico. O disparo
  # agora vem de fora, via cron-job.org chamando a API de workflow_dispatch
  # nos mesmos horarios de antes (ver README ou o guia de setup).
  workflow_dispatch:

jobs:
  notebook:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar repositório
      uses: actions/checkout@v3

    - name: Instalar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar dependências
      run: |
        pip install -r requirements.txt
        pip install jupyter nbconvert nbformat
        playwright install --with-deps chromium

    - name: Executar notebook
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        SHEET_ID: ${{ secrets.SHEET_ID }}
        SHEET_ID_CONTROLE_ENVIOS: ${{ secrets.SHEET_ID_CONTROLE_ENVIOS }}
        ID_GRUPO_MILHAS: ${{ secrets.ID_GRUPO_MILHAS }}
        ID_GRUPO_PESSOAL_TESTES: ${{ secrets.ID_GRUPO_PESSOAL_TESTES }}
        INSTANCE_ID: ${{ secrets.INSTANCE_ID }}
        API_KEY: ${{ secrets.API_KEY }}
        URL_SCRAPING: ${{ secrets.URL_SCRAPING }}
        URL_SCRAPING_TWO: ${{ secrets.URL_SCRAPING_TWO }}
        EMAIL_DESTINATARIO: ${{ secrets.EMAIL_DESTINATARIO }}
        EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
        SENHA_GMAIL: ${{ secrets.SENHA_GMAIL }}
        NUMERO_PESSOAL: ${{ secrets.NUMERO_PESSOAL }}
      run: |
        jupyter nbconvert --to notebook --execute Webscraping_Whats_Milhas_New_Version.ipynb --inplace

    - name: Mostrar saídas das células (debug)
      # O nbconvert --execute não ecoa os print()/erros das células no log
      # do Actions - eles ficam só guardados dentro do .ipynb executado, que
      # nem é salvo em lugar nenhum. Esse passo lê o notebook logo depois de
      # rodar e imprime tudo no log, pra dar pra debugar sem precisar salvar
      # o notebook executado em nenhum lugar. "if: always()" garante que
      # roda mesmo se o passo anterior falhar.
      if: always()
      run: |
        python3 - <<'EOF'
        import nbformat

        nb = nbformat.read("Webscraping_Whats_Milhas_New_Version.ipynb", as_version=4)
        for i, cell in enumerate(nb.cells):
            if cell.cell_type != "code":
                continue
            for out in cell.get("outputs", []):
                if out.get("output_type") == "stream":
                    texto = out.get("text", "")
                    if texto.strip():
                        print(f"--- Célula {i} ({out.get('name')}) ---")
                        print(texto)
                elif out.get("output_type") == "error":
                    print(f"--- Célula {i}: ERRO NÃO TRATADO ---")
                    print("\n".join(out.get("traceback", [])))
        EOF
