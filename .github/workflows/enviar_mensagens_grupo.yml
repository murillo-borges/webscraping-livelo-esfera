name: Enviar promoções diariamente no grupo

on:
  schedule:
    # Seg-Sex: de hora em hora, das 07h38 às 20h38 (horário de Brasília, UTC-3)
    - cron: '38 10-23 * * 1-5'
    # Sáb-Dom: de hora em hora, das 09h38 às 18h38 (horário de Brasília, UTC-3)
    - cron: '38 12-21 * * 0,6'
  workflow_dispatch:

jobs:
  notebook:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar repositório
      uses: actions/checkout@v3

    - name: Instalar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar dependências
      run: |
        pip install -r requirements.txt
        pip install jupyter nbconvert nbformat

    - name: Executar notebook
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        SHEET_ID: ${{ secrets.SHEET_ID }}
        SHEET_ID_CONTROLE_ENVIOS: ${{ secrets.SHEET_ID_CONTROLE_ENVIOS }}
        ID_GRUPO_MILHAS: ${{ secrets.ID_GRUPO_MILHAS }}
        ID_GRUPO_PESSOAL_TESTES: ${{ secrets.ID_GRUPO_PESSOAL_TESTES }}
        INSTANCE_ID: ${{ secrets.INSTANCE_ID }}
        API_KEY: ${{ secrets.API_KEY }}
        URL_SCRAPING: ${{ secrets.URL_SCRAPING }}
        URL_SCRAPING_TWO: ${{ secrets.URL_SCRAPING_TWO }}
        EMAIL_DESTINATARIO: ${{ secrets.EMAIL_DESTINATARIO }}
        EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
        SENHA_GMAIL: ${{ secrets.SENHA_GMAIL }}
        NUMERO_PESSOAL: ${{ secrets.NUMERO_PESSOAL }}
      run: |
        jupyter nbconvert --to notebook --execute Webscraping_Whats_Milhas_New_Version.ipynb --inplace
